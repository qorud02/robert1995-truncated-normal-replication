  "abstract": "We independently reproduce the univariate numerical results in Robert's study of truncated-normal simulation, using the author's archived reprint. Newly written Python code recalculates seven one-sided and twenty two-sided acceptance probabilities, reconstructs the algorithm-switching figure, and checks the samplers on 23.5 million fixed-seed proposals. Twenty-six of the twenty-seven printed cells agree at their stated three-decimal precision. The one-sided probability at lower truncation point 0.5 is printed as 0.826, while the stated optimized exponential proposal gives 0.8275277271, rounding to 0.828. Independent numerical integration supports the recalculation. All twenty two-sided values are reproduced by selecting between uniform and capped exponential proposals. The reconstructed switching boundary agrees with equality of the acceptance rates. The Monte Carlo experiment reports proposal-level uncertainty and accepted-sample distribution checks for every method-setting pair. The results support the univariate algorithms and identify a localized numerical discrepancy in the archived table. Code, source targets, fixed settings and complete numerical outcomes accompany the replication.",
